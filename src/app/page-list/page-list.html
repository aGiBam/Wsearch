<!-- {{ pages.length }} -->
<table class="table is-striped">
<thead>
  <tr>
    <th>Title</th>
    <th>Word Count</th>
    <th>Snippet</th>
  </tr>
</thead>
<tbody>
  @for (page of pages; track page.pageid) {
    <tr>
      <td>{{ page.title }}</td>
      <td>{{ page.wordcount }}</td>
      <td [innerHTML]="page.snippet"></td>
    </tr>
  }
</tbody>
</table>
